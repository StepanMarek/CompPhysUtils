[dataset.quad]
list = 0 1 2 3 4
	0 1 4 7.8 16.1
	0.01 0.01 0.01 0.2 0.1

[fit]
types = linear
	quadratic
	linear
cols = quad
	quad 0 quad 1 quad 2
	quad 0 quad 1 quad 2
fit_names = quad_linear
	quad_quadratic
	quad_lin_part
interpolation_names = int_linear
	int_quadratic
xlims = 0 5
	0 5
	0.5 3.5
color_cycle = green blue
labels = Linear fit
	Quadratic fit
	Linear part
savepoint = fit int_quadratic cols quadratic_interpolation.dat
	fit quad_lin_part cols quadratic_part_params.dat

[plot]
type = errorbar
cols = quad 0 quad 1 quad 2
labels = Data
figfile = quadratic.tex
