[dataset.grow]
list = 1 2 3 4
	1 4 9 16

[dataset.xtick_pos]
list = 1 2.5 4

[dataset.xtick_lab]
list = one two-half four
listtype = string

[dataset.ytick_pos]
list = 1 4 8 16

[dataset.ytick_lab]
list = $2^0$ $2^1$ $2^2$ $2^3$
listtype = string

[data]
combine = join xticks xtick_pos xtick_lab
	join yticks ytick_pos ytick_lab

[plot]
type = line
cols = grow 0 grow 1
legend = False
xticks = xticks
yticks = yticks
figfile = tick_labels.pgf
